# The Greeter service as its own Argo CD Application, separate from the cluster.
# Created by the platform team (Applications live in the argocd namespace). Manual sync.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: team-a-greeter   # per environment
  namespace: argocd
spec:
  project: team-a   # per environment
  source:
    repoURL: git@github.com:jgrier/restate-argocd-eks.git   # per environment
    targetRevision: main
    path: greeter/chart
    helm:
      releaseName: greeter
      valueFiles:
        - ../values-env.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: team-a   # per environment
