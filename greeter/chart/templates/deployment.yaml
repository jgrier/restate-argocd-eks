apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "greeter.name" . }}
  labels: {{- include "greeter.labels" . | nindent 4 }}
  {{- with include "greeter.annotations" . }}
  annotations: {{- . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels: {{- include "greeter.labels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "greeter.labels" . | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: {{ .Release.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - {name: restate, containerPort: 9080}
          env:
            # Only used by the template's demo controller on :3000.
            - {name: RESTATE_CLIENT_BASE_URI, value: "http://restate:8080"}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            tcpSocket: {port: restate}
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "greeter.name" . }}
  labels: {{- include "greeter.labels" . | nindent 4 }}
  {{- with include "greeter.annotations" . }}
  annotations: {{- . | nindent 4 }}
  {{- end }}
spec:
  selector: {{- include "greeter.labels" . | nindent 4 }}
  ports:
    - {name: restate, port: 9080, targetPort: restate}
