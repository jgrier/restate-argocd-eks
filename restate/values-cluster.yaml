# Restate: 3-node replicated cluster, deployed by Argo CD. The settings that
# make it work: restricted Pod Security, Istio, one-time provisioning, sizing.
# Layered on chart/values.yaml, then values-env.yaml. You shouldn't need to edit this.

replicaCount: 3

image:
  tag: "1.8.1"

# Passes the "restricted" Pod Security Standard.
podSecurityContext:
  fsGroup: 2000
  fsGroupChangePolicy: "OnRootMismatch"
  seccompProfile:
    type: RuntimeDefault

# No node provisions itself. The provision Job (an Argo CD Sync hook)
# provisions the cluster exactly once; later syncs are no-ops.
provisionJob:
  enabled: true
  numPartitions: 36
  replication: 2

env:
  - name: RESTATE_LOG_FORMAT
    value: json
  - name: RESTATE_CLUSTER_NAME
    value: restate
  - name: RESTATE_METADATA_CLIENT__ADDRESSES
    value: '["http://restate-cluster:5122"]'
  - name: RESTATE_AUTO_PROVISION
    value: "false"
  - name: DO_NOT_TRACK
    value: "true"
  # Keep under half of the memory limit below.
  - name: RESTATE_ROCKSDB_TOTAL_MEMORY_SIZE
    value: 3Gi
  - name: RESTATE_WORKER__SNAPSHOTS__SNAPSHOT_INTERVAL_NUM_RECORDS
    value: "100000"
  - name: RESTATE_WORKER__SNAPSHOTS__NUM_RETAINED
    value: "2"

# 4 vCPU / 8 GiB per node (1:2 CPU:RAM).
resources:
  requests:
    cpu: 4
    memory: 8Gi
  limits:
    cpu: 4
    memory: 8Gi

# One Restate pod per node.
topologySpreadConstraints:
  maxSkew: 1
  topologyKey: kubernetes.io/hostname
  whenUnsatisfiable: DoNotSchedule

podDisruptionBudget:
  maxUnavailable: 1
