# Restate: 3-node replicated cluster in namespace team-a, deployed by Argo CD.
# Layered on chart/values.yaml. Edit the "per environment" values for yours.

replicaCount: 3

image:
  repository: docker.restate.dev/restatedev/restate   # per environment: your mirror, if any
  tag: "1.8.1"

# Run as an existing ServiceAccount that the platform team linked to an IAM
# role allowed to read/write the snapshot bucket (IRSA or EKS Pod Identity).
serviceAccount:
  create: false
  name: restate-workload                               # per environment

# Passes the "restricted" Pod Security Standard.
podSecurityContext:
  fsGroup: 2000
  fsGroupChangePolicy: "OnRootMismatch"
  seccompProfile:
    type: RuntimeDefault

# No node provisions itself. The provision Job (an Argo CD Sync hook)
# provisions the cluster exactly once; later syncs are no-ops.
provisionJob:
  enabled: true
  numPartitions: 36
  replication: 2

env:
  - name: RESTATE_LOG_FORMAT
    value: json
  - name: RESTATE_CLUSTER_NAME
    value: restate
  - name: RESTATE_METADATA_CLIENT__ADDRESSES
    value: '["http://restate-cluster:5122"]'
  - name: RESTATE_AUTO_PROVISION
    value: "false"
  - name: DO_NOT_TRACK
    value: "true"
  - name: AWS_REGION
    value: us-east-2                                     # per environment
  # Keep under half of the memory limit below.
  - name: RESTATE_ROCKSDB_TOTAL_MEMORY_SIZE
    value: 3Gi
  - name: RESTATE_WORKER__SNAPSHOTS__DESTINATION
    value: s3://restate-argocd-eks-snapshots-171d0c/restate/snapshots   # per environment
  - name: RESTATE_WORKER__SNAPSHOTS__SNAPSHOT_INTERVAL_NUM_RECORDS
    value: "100000"
  - name: RESTATE_WORKER__SNAPSHOTS__NUM_RETAINED
    value: "2"

# 4 vCPU / 8 GiB per node (1:2 CPU:RAM).
resources:
  requests:
    cpu: 4
    memory: 8Gi
  limits:
    cpu: 4
    memory: 8Gi

storage:
  size: 20Gi                                             # size for your workload
  storageClassName: gp3                                  # per environment

# One Restate pod per node.
topologySpreadConstraints:
  maxSkew: 1
  topologyKey: kubernetes.io/hostname
  whenUnsatisfiable: DoNotSchedule

podDisruptionBudget:
  maxUnavailable: 1
